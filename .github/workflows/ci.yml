# Save as: .github/workflows/ci.yml
#
# Runs the same checks you run locally, using the settings in pyproject.toml:
#   lint (ruff), types (mypy --strict), tests + coverage (pytest), links.
# Keep the commands here identical to the Makefile so "passes locally" means
# "passes in CI".

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an older run of the same branch/PR when a newer commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Lint, format check, and type check. Run once; no need for a version matrix.
  # -------------------------------------------------------------------------
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

  # -------------------------------------------------------------------------
  # Tests and coverage across supported Python versions.
  # -------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The "ci" Hypothesis profile (registered in tests/conftest.py) runs more
      # examples than the local "dev" profile. Coverage floor comes from
      # [tool.coverage.report] fail_under in pyproject.toml.
      - name: Pytest with coverage
        run: pytest --cov --cov-report=term-missing --hypothesis-profile=ci

  # -------------------------------------------------------------------------
  # Markdown link check. Skipped until scripts/check_links.py exists, so the
  # workflow stays green during Phase 2 while the repo is being restructured.
  # -------------------------------------------------------------------------
  links:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check internal links
        run: |
          if [ -f scripts/check_links.py ]; then
            python scripts/check_links.py
          else
            echo "scripts/check_links.py not found yet; skipping link check."
          fi
